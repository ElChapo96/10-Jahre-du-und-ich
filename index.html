  <title>10 Jahre DU und ICH</title>

.memory-section{
max-width:900px;
margin:40px auto;
padding:20px;
}

.map{
width:90%;
max-width:900px;
border-radius:20px;
margin-bottom:25px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.memory-btn{
background:#d4af37;
border:none;
padding:15px 30px;
border-radius:50px;
font-size:18px;
font-weight:bold;
cursor:pointer;
color:white;
margin-bottom:25px;
}

.memory-btn:hover{
transform:scale(1.05);
}

.memory-card{
max-width:700px;
margin:auto;
background:rgba(255,255,255,.1);
padding:20px;
border-radius:20px;
backdrop-filter:blur(10px);
}

.memory-card img{
width:100%;
max-width:500px;
border-radius:15px;
}

.memory-card h2{
margin-top:15px;
}

.memory-card p{
font-size:18px;
}

  </style>

  <p class="intro">
    Zehn Jahre voller Erinnerungen, gemeinsamer Wege, Lachen, Lernen und besonderen Momenten.
    Diese Seite ist unser kleiner Rückblick auf diese Zeit.
    Ohana.
  </p>
