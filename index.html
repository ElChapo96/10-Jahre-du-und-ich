<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10 Jahre DU und ICH</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;

      background: url("background.jpg") no-repeat center center fixed;
      background-size: cover;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: -1;
    }

    h1 {
      padding: 30px 20px 10px;
      font-size: 32px;
      margin: 0;
    }

    .intro {
      max-width: 650px;
      margin: 0 auto 30px auto;
      font-size: 18px;
      line-height: 1.6;
      padding: 0 15px;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
      align-items: center;
    }

    .gallery img {
      width: 90%;
      max-width: 420px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      transition: transform 0.3s ease;
    }

    .gallery img:hover {
      transform: scale(1.03);
    }

    footer {
      margin: 40px 0 20px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <h1>10 Jahre DU und ICH</h1>

  <p class="intro">
    Zehn Jahre voller Erinnerungen, gemeinsamer Wege, Lachen, Lernen und besonderen Momenten.
    Diese Seite ist unser kleiner Rückblick auf diese Zeit.
  </p>

  <div class="gallery">
    <img src="bild1.jpg" alt="Erinnerung 1">
    <img src="bild2.jpg" alt="Erinnerung 2">
    <img src="bild3.jpg" alt="Erinnerung 3">
  </div>

  <footer>
    Für die schönsten 10 Jahre.
  </footer>
</body>
</html>
